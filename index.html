<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ghostlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: darkroom workbench. Image stage fills the left, a scrolling control rail sits on the right; stacks on phones. Single dark look so the image reads true. */
:root{
  --ground:#101314; --panel:#161a1c; --raise:#1d2225; --line:#2a3135;
  --ink:#e8e3d8; --dim:#8b938f; --faint:#5b6361;
  --ember:#e9a77a; --halo:#7fc4d8;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-ui:"Geist", "Helvetica Neue", system-ui, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:13px/1.4 var(--f-ui);margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--ground)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font:700 22px/1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand .mark{width:14px;height:14px;border-radius:50%;align-self:center;background:radial-gradient(circle at 35% 35%, #fff2d8, var(--ember) 45%, transparent 70%),radial-gradient(circle at 65% 60%, var(--halo), transparent 65%);box-shadow:0 0 12px rgba(233,167,122,.45)}
.brand .sub{color:var(--dim);font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--raise);cursor:pointer;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--faint)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.rec[data-on="1"]{background:#b8432b;border-color:#b8432b;color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.stage{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;background:#0b0d0e}
.canvasWrap{position:relative;display:grid;place-items:center;min-height:0;padding:18px;overflow:hidden}
#gl{display:block;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.drop{position:absolute;inset:10px;border:1.5px dashed var(--ember);border-radius:10px;display:grid;place-items:center;font:600 16px var(--f-display);color:var(--ember);background:rgba(16,19,20,.8);pointer-events:none}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;border-top:1px solid var(--line);background:var(--panel)}
.scrub{display:flex;align-items:center;gap:10px;flex:1 1 100%;min-width:0}
.scrub input{flex:1;min-width:0}
.scrub output{font:12px var(--f-mono);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.status{color:var(--dim);font-size:12px;flex:1 1 200px;min-width:0}
.status b{color:var(--ink);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.panel{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font:600 14px var(--f-display);letter-spacing:.01em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--faint);font:400 16px var(--f-mono)}
details[open] summary::after{content:"–"}
.sec{display:grid;gap:10px;padding:0 16px 16px}
.sub-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-top:6px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;align-items:center;gap:8px}
.row label{color:var(--dim);font-size:12px}
.row output{font:12px var(--f-mono);color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:0}
select{width:100%;height:28px;border-radius:5px;border:1px solid var(--line);background:var(--raise);padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--dim)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ember);color:var(--ink)}
.looks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.look{border:1px solid var(--line);border-radius:6px;background:var(--raise);padding:0;cursor:pointer;overflow:hidden;text-align:left}
.look .sw{display:block;height:34px}
.look span.n{display:block;padding:5px 7px;font-size:11.5px;color:var(--dim)}
.look[aria-pressed="true"]{border-color:var(--ember)}
.lookdel{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(10,12,13,.7);color:var(--ink);cursor:pointer;font-size:13px;line-height:20px;padding:0;opacity:.75}
.lookdel:hover,.lookdel:focus-visible{opacity:1}
.look[aria-pressed="true"] span.n{color:var(--ink)}
.swatches{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.swatch{display:grid;gap:3px;justify-items:center}
.swatch input{width:100%;height:30px;border:1px solid var(--line);border-radius:4px;padding:0;background:none;cursor:pointer}
.swatch input::-webkit-color-swatch-wrapper{padding:0}
.swatch input::-webkit-color-swatch{border:0;border-radius:3px}
.swatch span{font-size:9.5px;color:var(--faint);letter-spacing:.02em;white-space:nowrap}
.palettes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pal{display:grid;grid-template-rows:14px auto;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--raise);cursor:pointer;padding:0;text-align:left}
.pal .strip{display:flex}
.pal .strip i{flex:1}
.pal span{font-size:11px;color:var(--dim);padding:4px 6px}
.pal[aria-pressed="true"]{border-color:var(--ember)}
.mood{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px}
.mood input{height:32px;border-radius:6px;border:1px solid var(--line);background:var(--ground);padding:0 10px;min-width:0}
.note{font-size:11.5px;color:var(--faint);min-height:1em}
.toggle{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.modal{position:fixed;inset:0;background:rgba(5,6,7,.86);display:grid;place-items:center;padding:16px;z-index:10}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;max-width:min(92vw,900px);max-height:90vh}
.modal img,.modal video{max-width:100%;max-height:70vh;display:block}
@media (max-width:900px){
  .app{height:auto}
  .work{grid-template-columns:1fr}
  .canvasWrap{height:62vh}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Ghostlight</h1><span class="sub">double-exposure darkroom</span></div>
    <div class="actions">
      <button class="btn" id="btnOpen" type="button">Open photo or video</button>
      <input type="file" id="file" accept="image/*,video/*" hidden>
      <input type="file" id="goboFile" accept="image/*,video/*" hidden>
      <button class="btn primary" id="btnPng" type="button">Export image</button>
      <button class="btn rec" id="btnRec" type="button" data-on="0">Export video</button>
    </div>
  </header>
  <main class="work">
    <section class="stage" id="stage">
      <div class="canvasWrap" id="wrap"><canvas id="gl" width="960" height="1200"></canvas><div class="drop" id="drop" hidden>Drop a photo or video</div></div>
      <div class="stagebar">
        <div class="status" id="status">Sample bust loaded. Open your own photo or video, or drop it on the stage.</div>
        <div class="seg" role="group" aria-label="View">
          <button type="button" id="vRes" aria-pressed="true">Result</button>
          <button type="button" id="vMask" aria-pressed="false">Mask</button>
          <button type="button" id="vOrig" aria-pressed="false" title="Hold to compare">Hold original</button>
        </div>
        <div class="scrub" id="scrubWrap" hidden><button class="btn" id="btnPlay" type="button" hidden>Pause</button><input type="range" id="seek" min="0" max="1" step="0.0005" value="0" aria-label="Video position"><output id="seekT">0:00 / 0:00</output></div>
        <button class="btn" id="btnSeed" type="button" title="New random arrangement of the overlay">Reshuffle overlay</button>
      </div>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);

/* ---------------- Palettes ---------------- */
const PAL_KEYS = ["bg","bg2","shadow","mid","high","light","ember","halo"];

const PALETTES = [

/* ---------------- Overlay (floral light) presets ---------------- */
const GOBO_MODES = {dapple:0, leaves:1, blossom:2, sprig:3, ember:4, blinds:5, image:6, branch:7, caustic:8};

  {id:"maple",   name:"Maple",          kind:"maple",   p:{...BRANCH_P}},

  {id:"caustic", name:"Water caustics", p:{gobo:"caustic", polarity:0, gScale:3.4, gDens:.7, gSoft:.008, gFocus:.35, emberAmt:.4, light:1.15}},

/* ---------------- Parameters ---------------- */
const DEF = {
  maskMode:"auto", personTh:.5, personSoft:.06, keyTol:.16, keySoft:.12, lumaDarker:1, invertMask:0,

};
// Base recipe shared by the shadow looks: pale paper, dark figure, a warm spotlight through leaves that also falls on the wall
const SAGE={light:.9, polarity:1, wind:.4, pool:.9, poolX:.6, poolY:.64, poolSize:.36, spill:.4, blur:2, detail:.2, halo:.15, density:.92, bleed:.7, mottle:.4, fade:0, ghost:0, lightBleed:.5};
const LOOKS = [
  {name:"Sage Shadow", pal:4,  p:{...SAGE, flora:"maple"}},
  {name:"Oxblood",     pal:19, p:{...SAGE, flora:"maple", pool:.8, poolX:.58, poolY:.62, poolSize:.4, blur:2.2, keep:.3, halation:.6, spill:.35, bleed:.6, grain:.55, mottle:.3}},
  {name:"Cobalt Bloom",pal:5,  p:{flora:"grass", polarity:0, wind:.4, light:.8, pool:.4, poolX:.5, poolY:.55, poolSize:.5, edge:.2, feather:1, blur:2.4, detail:.12, sharpen:.35, contrast:1.35, keep:0, halo:.3, haloSize:6, bleed:.55, fade:0, ghost:0, spill:.15, lightBleed:.5}},

  {name:"Willow Dusk", pal:14, p:{...SAGE, flora:"willow", flutter:1, wind:.45, poolX:.55, poolY:.6, poolSize:.42, blur:2.4}},
  {name:"Moss Lantern",pal:15, p:{...SAGE, flora:"olive", gDens:1, light:.75, poolX:.55, poolY:.6, poolSize:.34, halation:.6, detail:.25}},
  {name:"Rose Smoke",  pal:16, p:{...SAGE, flora:"blossom", gDens:1, poolX:.48, poolY:.62, poolSize:.42, water:.5, bleed:.8, blur:2.6, keep:.2}},
  {name:"Night Garden",pal:17, p:{...SAGE, flora:"olive", gDens:1, poolX:.55, poolY:.6, poolSize:.45, halo:.35, haloSize:6, detail:.3, spill:.55, vignette:.35, grain:.6}},
  {name:"Blinds Noir", pal:11, p:{...SAGE, flora:"blinds", wind:.15, pool:.8, poolX:.6, poolY:.6, poolSize:.5, contrast:1.35, detail:.35, spill:.6, grain:.7, grainSize:1.8, bleed:.5}},
  {name:"Peach Fog",   pal:18, p:{...SAGE, flora:"petals", wind:.45, poolX:.5, poolY:.6, poolSize:.45, blur:2.6, halo:.25, haloSize:6}},
  {name:"Night Halo",  pal:3,  p:{flora:"willow", polarity:1, wind:.3, light:.35, pool:.3, halo:.9, haloSize:5.5, rim:.15, blur:3, detail:.2, edge:.2, vignette:.5, grain:.5, bleed:.6, flow:.6, ghost:0, fade:0, spill:0, lightBleed:.3}},
];

let P = {...DEF};
let PAL = PALETTES[2].c.slice();
let palName = PALETTES[2].name;
let lookIdx = 0;

/* ---------------- WebGL ---------------- */
const cv = $("#gl");
const gl = cv.getContext("webgl2", {preserveDrawingBuffer:true, premultipliedAlpha:false, antialias:false});
if (!gl) { $("#status").textContent = "This browser has no WebGL2, which Ghostlight needs to render."; throw new Error("no webgl2"); }
const HALF = !!gl.getExtension("EXT_color_buffer_float");
gl.getExtension("OES_texture_float_linear");
const MAXTEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);

const VS = `#version 300 es
out vec2 vUv; void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); vUv=p; gl_Position=vec4(p*2.-1.,0.,1.); }`;

const COMMON = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform float uSeed;
float h1(vec2 p){ p=fract(p*vec2(123.34,456.21)+uSeed*.01731); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 h2(vec2 p){ float a=h1(p); return vec2(a,h1(p+a*17.17+3.1)); }
float vn(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h1(i),h1(i+vec2(1,0)),u.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),u.x),u.y); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<5;i++){ s+=a*vn(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
uint hu(uvec3 v){ v=v*1664525u+1013904223u; v.x+=v.y*v.z; v.y+=v.z*v.x; v.z+=v.x*v.y; v^=v>>16u; v.x+=v.y*v.z; v.y+=v.z*v.x; v.z+=v.x*v.y; return v.x; }
float hf(uvec3 v){ return float(hu(v)&0xffffffu)/16777216.; }
mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,s,-s,c); }
`;

const FS_MASK = COMMON + `
uniform sampler2D tSrc,tSeg,tPrev; uniform float uMode,uTol,uSoft,uDarker,uInv,uSmooth,uSegA,uPTh,uPSoft; uniform vec3 uKey;
void main(){
  vec4 s=texture(tSrc,vUv); float m=1.;
  if(uMode<.5){ vec4 g=texture(tSeg,vUv); float pr = uSegA>.5 ? g.a : g.r; m=smoothstep(uPTh-uPSoft,uPTh+uPSoft,pr); }
  else if(uMode<1.5){ m=smoothstep(uTol,uTol+uSoft,distance(s.rgb,uKey)); }
  else if(uMode<2.5){ float l=dot(s.rgb,vec3(.299,.587,.114)); if(uDarker>.5) l=1.-l; m=smoothstep(uTol*2.,uTol*2.+uSoft,l); }
  else if(uMode<3.5){ m=s.a; }
  if(uInv>.5) m=1.-m;
  float pm=texture(tPrev,vUv).r;
  // steady small edge jitter, but let real movement through so the mask does not trail behind the subject
  float keep=uSmooth*(1.-smoothstep(.2+.3*(1.-uSmooth),.75,abs(m-pm)));
  m=mix(m,pm,keep);
  o=vec4(m,m,m,1.);
}`;

const FS_BLUR = `#version 300 es
precision highp float; in vec2 vUv; out vec4 o; uniform sampler2D t; uniform vec2 uDir;
void main(){ vec4 c=vec4(0.); float ws=0.;
  for(int i=-6;i<=6;i++){ float f=float(i); float w=exp(-f*f/18.); c+=texture(t,vUv+uDir*f)*w; ws+=w; }
  o=c/ws; }`;

const FS_GOBO = COMMON + `
uniform float uMode,uScale,uRot,uSpread,uDens,uSoft,uDepth,uWidth,uPetals,uLeaflets,uPairs,uBend,uTime,uWind,uAspect,uLayers,uImgAspect,uImgC,uImgInv;
uniform vec2 uPan,uAnchor; uniform sampler2D tImg,tFlora;
float leaf(vec2 q,float w,float soft){
  float x=clamp(q.x,-1.,1.);
  float prof=w*pow(max(1.-x*x,0.),.75)*(1.-.25*x);
  float d=max(abs(q.y)-prof, abs(q.x)-1.);
  return 1.-smoothstep(-soft,soft,d);
}
float blossom(vec2 q,float soft){
  float r=length(q), a=atan(q.y,q.x);
  float e=mix(3.,.35,uWidth);
  float R=.28+.72*pow(abs(cos(a*uPetals*.5)),e);
  float c=1.-smoothstep(-soft,soft,r-R);
  return c*(1.-.35*(1.-smoothstep(.08,.16,r)));
}
float sprig(vec2 q,float soft,float sd){
  float sx=uBend*q.y*q.y;
  float c=(q.y>0.&&q.y<1.)?1.-smoothstep(.012,.012+soft,abs(q.x-sx)):0.;
  for(int k=0;k<16;k++){
    float fk=float(k); if(fk>=uLeaflets) break;
    float t=(fk+.7)/(uLeaflets+.4);
    vec2 base=vec2(uBend*t*t,t);
    vec2 td=normalize(vec2(2.*uBend*t,1.));
    float len=mix(.2,.08,t)*(.8+.4*h1(vec2(fk,sd)));
    for(int sdI=0;sdI<2;sdI++){
      float side = (uPairs>.5) ? (sdI==0?1.:-1.) : (mod(fk,2.)<1.?1.:-1.);
      if(uPairs<.5 && sdI==1) break;
      vec2 ld=rot(side*.8)*td;
      vec2 d=q-(base+ld*len);
      vec2 lq=vec2(dot(d,ld),dot(d,vec2(-ld.y,ld.x)))/len;
      c=max(c,leaf(lq,uWidth,soft/len));
    }
  }
  vec2 d=q-vec2(uBend,1.08); c=max(c,leaf(vec2(d.y,d.x)/.1,uWidth,soft/.1));
  return c;
}
float cvor(vec2 p,float t){ vec2 i=floor(p), f=fract(p); float d1=8., d2=8.;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec2 b=vec2(x,y); vec2 r=h2(i+b); r=.5+.42*sin(t*1.1+6.2831*r);
    float d=length(b+r-f); if(d<d1){ d2=d1; d1=d; } else if(d<d2) d2=d; }
  return d2-d1; }
float cells(vec2 p){
  float cov=0.;
  for(int l=0;l<3;l++){
    float fl=float(l); if(fl>=uLayers) break;
    float sc=1.+fl*.6;
    vec2 pl=p*sc+vec2(fl*13.7,fl*7.3)+vec2(sin(uTime*.7+fl),cos(uTime*.5+fl*2.))*uWind*.12*(1.+fl*.5);
    float soft=uSoft*(1.+fl*uDepth*3.)*sc;
    float alpha=1.-fl*.18*uDepth;
    vec2 ci=floor(pl);
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
      vec2 cell=ci+vec2(i,j);
      if(h1(cell*.71+fl*31.)>uDens) continue;
      vec2 ra=h2(cell*1.7+fl*5.), rb=h2(cell*3.1+fl*11.);
      vec2 ctr=cell+.5+(ra-.5)*.9;
      float ang=uRot+(rb.x-.5)*6.2831*uSpread+sin(uTime*.9+rb.y*6.)*uWind*.15;
      float size=.45+.5*rb.y;
      vec2 q=rot(ang)*(pl-ctr)/size;
      float s;
      if(uMode<1.5) s=leaf(q,uWidth,soft/size);
      else if(uMode<2.5) s=blossom(q,soft/size);
      else s=sprig(q+vec2(0.,.5),soft/size,rb.x*7.);
      cov=max(cov,s*alpha);
    }
  }
  return cov;
}
void main(){
  vec2 p=(vUv-.5)*vec2(uAspect,1.)*uScale+uPan*uScale;
  float t=uTime*uWind;
  float g=0.;
  if(uMode<.5){
    vec2 w=vec2(fbm(p*.8+t*.08),fbm(p*.8+5.2-t*.06));
    float n=fbm(p*1.3+w*1.2+uSeed*.37);
    float th=mix(.72,.32,uDens);
    g=smoothstep(th-uSoft*4.,th+uSoft*4.,n);
  } else if(uMode<3.5){
    g=cells(p);
  } else if(uMode<4.5){
    vec2 w=vec2(fbm(p*.7+t*.1),fbm(p*.7+5.2));
    float n=fbm(p*1.2+w*1.6+uSeed*.37);
    float r=1.-abs(n-.5)*2.;
    float th=mix(.97,.72,uDens);
    g=smoothstep(th-uSoft*3.,th+uSoft*3.,r);
    g=max(g, .35*smoothstep(th-.2,th,r));
  } else if(uMode<5.5){
    vec2 q=rot(uRot)*p;
    float f=fract(q.y+t*.05);
    g=1.-smoothstep(uDens-uSoft*3.,uDens+uSoft*3.,abs(f-.5)*2.);
  } else if(uMode>7.5){
    vec2 q=p*1.2;
    q+=vec2(sin(q.y*.9+t*.35)+sin(q.y*.37-t*.21), cos(q.x*.8-t*.3)+sin(q.x*.41+t*.17))*.38;
    q+=vec2(fbm(q*.45+t*.05),fbm(q*.45+4.1-t*.04))*1.2;
    float w=.045+uSoft*1.6;
    float e1=cvor(q,t), e2=cvor(q*1.6+3.1,t*1.3);
    float c1=1.-smoothstep(0.,w,e1), c2=1.-smoothstep(0.,w*1.3,e2);
    float glow=(1.-smoothstep(0.,w*5.,e1))*.18+(1.-smoothstep(0.,w*5.,e2))*.12;
    g=clamp((c1*1.3+c2*.7+c1*c2*1.8)*mix(.45,1.4,fbm(q*.35+t*.04))+glow,0.,1.);
    g=mix(g*g,g,uDens);
  } else if(uMode>6.5){
    vec2 q=rot(uRot)*((vUv-.5)*vec2(uAspect,1.))/max(uScale,.05)+.5-uPan*.5;
    float dA=length(q-uAnchor);
    float tt=uTime;
    vec2 sway=vec2(0.), flut=vec2(0.);
    float lodN=log2(1.+uSoft*90.);
    vec2 qn=q+sway+flut;
    float nr=textureLod(tFlora,qn,lodN).r*step(0.,qn.x)*step(qn.x,1.)*step(0.,qn.y)*step(qn.y,1.);
    vec2 qf=(q-.5)*.94+.5+vec2(.018,.01)+sway*.55+flut*.5;
    float fr=textureLod(tFlora,qf,lodN+1.2+uDepth*2.2).g*step(0.,qf.x)*step(qf.x,1.)*step(0.,qf.y)*step(qf.y,1.);
    g=max(nr, fr*(1.-.3*uDepth));
  } else {
    vec2 q=rot(uRot)*((vUv-.5)*vec2(uAspect,1.))/max(uScale*.25,.05);
    q.x/=uImgAspect; q+=.5+uPan;
    vec3 c=texture(tImg,q).rgb;
    float l=dot(c,vec3(.299,.587,.114));
    l=clamp((l-.5)*uImgC+.5,0.,1.);
    g=uImgInv>.5?1.-l:l;
  }
  o=vec4(g,g,g,1.);
}`;

const FS_NOISE = COMMON + `
uniform float uAspect,uBleedScale;
void main(){ vec2 nq=vUv*vec2(uAspect,1.)*uBleedScale;
  o=vec4(fbm(nq+uSeed*.13), fbm(nq*2.1+3.3), fbm(nq*2.1+8.1), fbm(vUv*vec2(uAspect,1.)*6.+uSeed*2.)); }`;
const FS_COMP = COMMON + `
uniform sampler2D tSrc,tSrcB,tMask,tGlow,tBleed,tGobo,tGoboW,tNoise;
uniform vec2 uRes; uniform float uAspect,uTime,uFrame,uView,uGrainPx,uPxScale;
uniform vec3 cBg,cBg2,cSh,cMid,cHi,cLight,cEmber,cHalo;
uniform float uThresh,uEdge,uDensity,uDetail,uKeep,uContrast,uExposure,uSharpen,uClarity;
uniform float uLightBleed,uBreath,uLight,uEmberAmt,uPool,uPoolSoft,uPolarity,uSpill; uniform vec2 uPoolPos,uPoolSize;
uniform float uHalo,uRim,uGhost; uniform vec2 uGhostOff;
uniform float uFade,uFadeSoft,uFadeRough;
uniform float uBleed,uBleedScale,uFlow,uTide,uMottle,uWater,uRag,uWashDens;
uniform float uDustOp,uGrain,uHalation,uChroma,uVignette,uLift,uDust,uLeak;
vec3 screen(vec3 a,vec3 b){ return 1.-(1.-a)*(1.-b); }
float luma(vec3 c){ return dot(c,vec3(.299,.587,.114)); }
vec3 gmap(float l){ return l<.5 ? mix(cSh,cMid,smoothstep(0.,.5,l)) : mix(cMid,cHi,smoothstep(.5,1.,l)); }
float maskAt(vec2 uv, out float glow, out float bleedN, out float tide){
  vec4 nz=texture(tNoise,uv);
  bleedN=smoothstep(.44,.7,nz.r);
  vec2 warp=(nz.gb-.5)*uFlow*.06*(.3+bleedN);
  vec2 wv=uv+warp;
  float ms=texture(tMask,wv).r;
  float mb=texture(tBleed,wv).r;
  float sharp=smoothstep(uThresh-uEdge,uThresh+uEdge,ms);
  float soft=smoothstep(.04,.96,mb);
  float k=bleedN*uBleed;
  // soft dissolve: a true variable-width blur of the edge. The transition width grows with k,
  // so the edge goes smoothly from crisp to fully melted instead of a hard line plus a halo.
  float w=k*.5;
  float melt=smoothstep(uThresh-w-.02,uThresh+w+.02,mb);
  float mSoft=mix(sharp,melt,smoothstep(0.,.12,k));
  // watercolor leak: pigment creeps outward with ragged, crisp-ish fingers, a pale wash and a darker drying rim
  vec2 aq=uv*vec2(uAspect,1.)*uRag;
  float rag=vn(aq*7.+uSeed)*.55+vn(aq*19.+uSeed*1.7)*.3+vn(aq*47.+3.1)*.15;
  vec2 fw=((vec2(vn(aq*11.+1.3),vn(aq*11.+7.7))-.5)*.06+(vec2(vn(aq*37.+2.),vn(aq*37.+5.))-.5)*.02)*k;
  float mbw=texture(tBleed,wv+fw).r;
  float reach=clamp(k*smoothstep(.25,.85,rag)*1.25,0.,1.);
  float th=mix(.5,.02,reach);
  float lw=.02+.07*(1.-rag);
  float leak=smoothstep(th-lw,th+lw,mbw);
  float wash=leak*(1.-sharp);
  float dens=mix(.3,.78,smoothstep(.2,.9,rag))*uWashDens;
  float gran=1.+(vn(aq*90.+uSeed)-.5)*.5;
  float mWater=clamp(sharp+wash*dens*gran,0.,1.);
  float rim=wash*(1.-smoothstep(th,th+.28,mbw))*.7;
  float m=mix(mSoft,mWater,uWater);
  tide=rim*(.4+.6*rag)*uWater;
  glow=texture(tGlow,wv).r;
  return m;
}

// one dust layer: x = dark coverage, y = light coverage (scratched-off emulsion)
vec2 dustLayer(vec2 fc,float cellPx,uint seed,float dens,float soft){
  vec2 p=fc/cellPx, ci=floor(p); vec2 acc=vec2(0.);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 cell=ci+vec2(i,j); uvec2 uc=uvec2(ivec2(cell)+4096);
    float r0=hf(uvec3(uc,seed)); if(r0>dens) continue;
    float r1=hf(uvec3(uc,seed+101u)), r2=hf(uvec3(uc,seed+202u)), r3=hf(uvec3(uc,seed+303u)), r4=hf(uvec3(uc,seed+404u));
    vec2 c=cell+vec2(r1,r2);
    vec2 d=p-c;
    float a=0.;
    float blur=soft>.5 ? .03+.06*r4 : .007+.014*r3;
    if(r3<.62){
      // speck: irregular clump of dust
      float ang=atan(d.y,d.x);
      float rad=(soft>.5 ? .04+.1*r4*r4 : .008+.045*pow(r4,4.));
      rad*=1.+.3*sin(ang*3.+r1*6.28)+.15*sin(ang*7.+r2*6.28);
      a=1.-smoothstep(rad-blur,rad+blur,length(d));
    } else {
      // fiber: a thin curling hair
      vec2 q=rot(r4*6.2832)*d;
      float L=.08+.32*r1*r1;
      float x=clamp(q.x,-L,L);
      float yc=(r2-.5)*4.*x*x+.025*sin(x*(14.+18.*r4)+r1*6.28)*L*3.;
      float w=(soft>.5? .01 : .0025+.003*r2);
      float dist=length(vec2(q.x-x,q.y-yc));
      a=(1.-smoothstep(w,w+blur,dist))*(1.-smoothstep(L*.85,L,abs(q.x))*.6);
    }
    float op=.45+.55*hf(uvec3(uc,seed+505u));
    if(soft<.5 && r0<dens*.18) acc.y=max(acc.y,a*op); else acc.x=max(acc.x,a*op*(soft>.5?.75:1.));
  }
  return acc;
}
vec3 comp(vec2 uv, out float a){
  float glow,bleedN,tide;
  float m=maskAt(uv,glow,bleedN,tide);
  float f=1.;
  if(uFade>0.){
    float n=(texture(tNoise,uv).g-.5)*2.*uFadeRough;
    f=smoothstep(uFade-uFadeSoft,uFade+uFadeSoft,uv.y+n*.3);
  }
  vec3 sh=texture(tSrc,uv).rgb, sb=texture(tSrcB,uv).rgb;
  vec2 px=1./uRes;
  vec3 nb=(texture(tSrc,uv+vec2(px.x,0.)).rgb+texture(tSrc,uv-vec2(px.x,0.)).rgb+texture(tSrc,uv+vec2(0.,px.y)).rgb+texture(tSrc,uv-vec2(0.,px.y)).rgb)*.25;
  vec3 nb2=(texture(tSrc,uv+vec2(px.x,px.y)*2.5).rgb+texture(tSrc,uv-vec2(px.x,px.y)*2.5).rgb+texture(tSrc,uv+vec2(px.x,-px.y)*2.5).rgb+texture(tSrc,uv-vec2(px.x,-px.y)*2.5).rgb)*.25;
  vec3 shp=sh+(sh-nb)*uSharpen*1.6+(sh-nb2)*uSharpen*.8;
  vec3 s=mix(sb,shp,uDetail);
  float lraw=luma(s)+(luma(s)-luma(sb))*uClarity*1.5;
  float l=clamp((lraw-.5)*uContrast+.5+uExposure,0.,1.);
  vec3 inside=gmap(l);
  inside=mix(inside, inside*(.55+.9*s/max(luma(s),.05)), uKeep);
  float g=texture(tGobo,uv).r;
  float gl=mix(g,1.-g,uPolarity);
  vec2 pd=(uv-uPoolPos)*vec2(uAspect,1.)/max(uPoolSize,.01);
  float pool=1.-smoothstep(1.-uPoolSoft,1.+.001,length(pd));
  float breath=1.-uBreath*.22*smoothstep(.3,.75,vn(vec2(uTime*.12,uSeed)+uv*vec2(uAspect,1.)*.6));
  float L=gl*mix(1.,pool,uPool)*uLight*breath;
  float core=smoothstep(.45,1.,L);
  float rimL=smoothstep(.02,.4,L)*(1.-core);
  inside=screen(inside, cLight*core + cEmber*rimL*uEmberAmt);
  inside=mix(inside, inside*cEmber*1.4, rimL*uEmberAmt*.25);
  float gw=texture(tGoboW,uv).r; float Lw=mix(gw,1.-gw,uPolarity)*mix(1.,pool,uPool)*uLight;
  inside+=cEmber*Lw*uHalation*.5;
  inside=screen(inside, cLight*Lw*uLightBleed*.45*breath);
  vec2 bq=uv*vec2(uAspect,1.);
  vec3 bg=mix(cBg2,cBg,smoothstep(-.2,1.1,uv.y*.7+uv.x*.3+(texture(tNoise,uv*.5).r-.5)*.3));
  float Lb=gl*mix(1.,pool,uPool*.6)*uSpill;
  bg=screen(bg, cLight*Lb*.7);
  bg=mix(bg, bg*(cMid*.9+.25), clamp((1.-gl)*uPolarity*uSpill*mix(1.,pool,uPool*.6),0.,1.)*.55);
  float mott=1.+(texture(tNoise,uv).a-.5)*uMottle*1.2;
  a=clamp(m*f*uDensity*mott,0.,1.);
  vec3 col=mix(bg,inside,a);
  col=mix(col, col*mix(vec3(1.),cSh*1.6,.6), clamp(tide*uTide*2.5,0.,1.)*f);
  vec3 bl=mix(cEmber,cLight,.55)*Lw*breath*uLightBleed;
  col=screen(col, bl*glow*(1.-a*.6)*.9);
  col=mix(col, screen(col,bg*.6), smoothstep(.0,.5,glow)*(1.-smoothstep(.5,1.,glow))*uLightBleed*.5*a);
  float outer=max(glow-m,0.)*f;
  col=screen(col,cHalo*outer*uHalo*1.6);
  float inner=m*clamp((1.-glow)*2.2,0.,1.)*f;
  col=screen(col,cHalo*inner*uRim);
  float gh=texture(tGlow,uv-uGhostOff).r*(1.-.75*m);
  col=mix(col,mix(cHalo,cMid,.35),clamp(gh*uGhost,0.,1.));
  return col;
}
void main(){
  vec2 uv=vUv;
  if(uView>1.5){ o=vec4(texture(tSrc,uv).rgb,1.); return; }
  float a;
  if(uView>.5){ float gw,bn,td; float m=maskAt(uv,gw,bn,td); o=vec4(vec3(m),1.); return; }
  vec2 d=(uv-.5)*uChroma*.012;
  float a1,a2;
  vec3 c=comp(uv,a);
  vec3 col=vec3(comp(uv+d,a1).r, c.g, comp(uv-d,a2).b);
  col=clamp(col,0.,1.);
  float lm0=luma(col);
  col=mix(col, mix(cSh,cBg,.45), uLift*.4*pow(max(1.-lm0,0.),1.5));
  vec2 vq=(uv-.5)*vec2(uAspect,1.);
  col*=1.-uVignette*smoothstep(.25,1.1,length(vq)*1.3);
  float lk=exp(-pow((uv.x+.05)*3.,2.))*(.6+.6*texture(tNoise,uv*.4+vec2(0.,uTime*.01)).r);
  col=screen(col,cEmber*lk*uLeak);
  vec2 fc=gl_FragCoord.xy;
  uint fr=uint(mod(uFrame,4096.));
  // projector dust: a static, out-of-focus lens layer plus sharp gate dust that jumps every few frames
  if(uDust>0.){
    vec2 lens=dustLayer(fc,150.*uPxScale,77u,uDust*.16,1.);
    vec2 gate=dustLayer(fc,70.*uPxScale,fr/3u+1u,uDust*.32,0.);
    // overlay blend: dust is a grey layer (0.5 = no change), dark particles below, light flecks above
    float dl=clamp(.5-gate.x*.5-lens.x*.28+gate.y*.4,0.,1.);
    vec3 ov=mix(2.*col*dl, 1.-2.*(1.-col)*(1.-dl), step(.5,col));
    col=mix(col,ov,uDustOp);
  }
  // film grain: two clump sizes, zero-mean, strongest in the midtones; integer hash so it never degrades over long sessions
  float gp=max(uGrainPx,1.);
  uvec2 g1=uvec2(fc/gp), g2=uvec2(fc/(gp*2.2));
  float n1=(hf(uvec3(g1,fr))+hf(uvec3(g1,fr+4099u))+hf(uvec3(g1,fr+8209u)))/3.-.5;
  float n2=(hf(uvec3(g2,fr+17u))+hf(uvec3(g2,fr+4111u)))/2.-.5;
  float n=n1*1.25+n2*.75;
  vec3 cn=vec3(hf(uvec3(g1,fr+31u)),hf(uvec3(g1,fr+37u)),hf(uvec3(g1,fr+41u)))-.5;
  float lm=luma(col);
  float w=.35+2.6*lm*(1.-lm);
  vec3 gr=(vec3(n)+cn*.3)*uGrain*.34*w;
  col+=gr;
  col*=1.+(texture(tNoise,uv*.7).a-.5)*uGrain*.06;
  o=vec4(clamp(col,0.,1.),1.);
}`;

async function loadSource(file){

    let el=im, w=im.naturalWidth, h=im.naturalHeight;
    if(Math.max(w,h)>MAXTEX){ const k=MAXTEX/Math.max(w,h); const c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); el=c; w=c.width; h=c.height; }

}

function hseed(i){ const v=Math.sin(i*127.1+P.seed*3.7)*43758.5453; return v-Math.floor(v); }
function vn1(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return hseed(i)*(1-u)+hseed(i+1)*u; }
// Gust field: bands of stronger wind travelling left to right across the frame
function gust(x,y,t){ const n=vn1(x*.0016+y*.0005-t*.45)*.65+vn1(x*.0042-t*.95+11.3)*.35; return Math.pow(n,1.6)*1.7; }

/* Leaf atlas: 8x8 cells of 256x128, each one leaf shape filling its cell, base at the left edge */
const atlasCv=document.createElement("canvas"); atlasCv.width=2048; atlasCv.height=1024;
const ATLAS_KIND={olive:["lance",.05,"lance",.05], maple:["maple",0,"maple",0], blossom:["flower",0,"lance",.07], willow:["lance",.03,"lance",.03], grass:["lance",.18,"lance",.18], fern:["lance",0,"lance",0]};
function buildAtlas(kind,R){
  const x=atlasCv.getContext("2d"); x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,2048,1024); x.fillStyle="#fff";
  const spec=ATLAS_KIND[kind]||ATLAS_KIND.olive;
  for(let v=0;v<64;v++){
    const cx=(v%8)*256+4, cy=Math.floor(v/8)*128+4, cw=248, ch=120;
    const [type,pf]= v<32 ? [spec[0],spec[1]] : [spec[2],spec[3]];
    x.save(); x.beginPath(); x.rect(cx,cy,cw,ch); x.clip();
    if(type==="lance"){
      const pet=pf*100, len=100, wid=15, L=pet+len, W=wid*2.3;
      x.setTransform(cw/L,0,0,ch/W,cx,cy+ch/2);
      const k=.25+R()*.2, a=.85+R()*.3, tip=(R()-.5)*.16*wid;
      if(pet>0) x.fillRect(0,-1.4,pet+2,2.8);
      x.beginPath(); x.moveTo(pet,0); x.quadraticCurveTo(pet+len*k,-wid*a,pet+len,tip); x.quadraticCurveTo(pet+len*k,wid*(2-a),pet,0); x.fill();
    } else if(type==="maple"){
      const L=1.45, W=1.08; x.setTransform(cw/L,0,0,ch/W,cx,cy+ch/2);
      x.fillRect(0,-.012,.47,.024);
      const c0=.45+.5, ph=(R()-.5)*.3; x.beginPath();
      for(let i=0;i<=90;i++){ const th=i/90*Math.PI*2, lob=Math.pow(Math.abs(Math.cos(2.5*(th+ph))),1.4), teeth=.06*Math.max(0,Math.sin(th*23)), back=Math.cos(th)<-.6?.55:1;
        const r=.5*(.42+.58*lob+teeth)*back; const X=c0+Math.cos(th)*r, Y=Math.sin(th)*r; i?x.lineTo(X,Y):x.moveTo(X,Y); }
      x.fill();
    } else {
      const r=10, L=25, W=28; x.setTransform(cw/L,0,0,ch/W,cx,cy+ch/2);
      const ro=R()*6.283, c0=11; x.fillRect(0,-1,c0,2);
      for(let i=0;i<5;i++){ const a=ro+i/5*6.283; x.beginPath(); x.ellipse(c0+Math.cos(a)*r*.75,Math.sin(a)*r*.75,r*.62,r*.5,a,0,6.2832); x.fill(); }
      x.beginPath(); x.arc(c0,0,r*.45,0,6.2832); x.fill();
    }
    x.restore();
  }
  gl.bindTexture(gl.TEXTURE_2D,T.atlas);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,atlasCv);
  gl.generateMipmap(gl.TEXTURE_2D);
}

function makeFlora(kind, seed, dens){
  const G=1/(.6+dens*.8), N=FN;
  const out={layers:[], anchor:[0,0]};
  buildAtlas(kind, rng(seed*31+hashStr(kind)));
  for(let layer=0;layer<2;layer++){
    const R=rng(seed*(layer?104729:7919)+hashStr(kind)+layer*3);
    const rr=(a,b)=>a+(b-a)*R();
    const L={limbs:[],leaves:[]}; out.layers.push(L);
    const s=layer?1.08:1;
    const vA=()=>Math.floor(R()*32), vB=()=>32+Math.floor(R()*32);
    const lance=(len,wid,pet,b)=>({v:b?vB():vA(), L:pet+len, W:wid*2.3});
    const addLeaf=(limb,pt,rel,sp,flex=1)=>L.leaves.push({limb,pt,rel,v:sp.v,L:sp.L,W:sp.W,flex,ph:R()*6.283,f:rr(2.2,5.2)});
    const limb=(parent,ppt,x0,y0,ang,len,w,depth,o)=>{
      const steps=Math.max(4,Math.round(len/(o.segLen||22))), seg=len/steps;
      const rel=new Float32Array(steps), wd=new Float32Array(steps+1), abs=new Float32Array(steps+1);
      let a = parent<0 ? ang : L.limbs[parent].abs[ppt]+ang;
      for(let i=0;i<=steps;i++){ wd[i]=Math.max(o.minW,w*(1-i/steps*o.taper)); abs[i]=a;
        if(i<steps){ const d=(R()-.5)*o.wiggle+o.gravity*Math.cos(a)+(o.curve||0)*seg; rel[i]=d; a+=d; } }
      const id=L.limbs.length;
      L.limbs.push({parent,ppt,x0,y0,a0:parent<0?ang:0,relA:parent<0?0:ang,seg,rel,wd,abs,steps,
        flex:(o.flex||1.5)/(1+w*.06),ph:R()*6.283,f1:rr(.5,.9),f2:rr(1.3,2.1),
        X:new Float32Array(steps+1),Y:new Float32Array(steps+1),A:new Float32Array(steps+1)});
      if(depth>0) for(let k=0;k<o.kids;k++){ const t=rr(.2,.85), pi=Math.floor(t*steps), side=R()<.5?-1:1;
        limb(id,pi,0,0,side*rr(o.spread[0],o.spread[1]),len*rr(.42,.68)*(1-t*.25),wd[pi]*.78,depth-1,o); }
      if(o.leaf && depth<=o.leafDepth){
        let side=R()<.5?1:-1;
        for(let d=o.leafStart*len; d<len; d+=o.leafGap*rr(.6,1.4)){
          side=-side; addLeaf(id,Math.min(steps,Math.round(d/seg)),side*rr(o.la[0],o.la[1]),o.leaf(),o.leafFlex||1); }
        addLeaf(id,steps,rr(-.15,.15),o.leaf(),o.leafFlex||1);
      }
      return id;
    };
    if(kind==="olive"){
      const o={minW:1.5,taper:.85,wiggle:.09,gravity:.004,kids:3,spread:[.35,.8],leafDepth:1,leafStart:.25,leafGap:24*G,la:[.45,.85],flex:1.6,
        leaf:()=>lance(rr(60,95)*s,rr(8,12)*s,4)};
      const y0=rr(.08,.3)*N; limb(-1,0,-40,y0,rr(.15,.45),N*rr(.95,1.2),26*s,3,o); if(!layer) out.anchor=[0,y0];
      for(let i=0;i<Math.round(dens*3);i++) limb(-1,0,-40,rr(0,.7)*N,rr(-.1,.6),N*rr(.6,1),rr(14,22)*s,3,o);
      limb(-1,0,rr(.55,.95)*N,-40,rr(1.75,2.3),N*rr(.55,.75),16*s,2,o);
    } else if(kind==="maple"){
      const o={minW:2,taper:.8,wiggle:.12,gravity:.006,kids:3,spread:[.4,.9],leafDepth:1,leafStart:.35,leafGap:80*G,la:[.6,1.1],flex:1.4,leafFlex:.8,
        leaf:()=>{ const l=rr(120,180)*s; return {v:Math.floor(R()*64), L:l*1.45, W:l*1.08}; }};
      const y0=rr(.02,.25)*N; limb(-1,0,N+40,y0,rr(2.55,2.95),N*rr(1,1.2),30*s,3,o); if(!layer) out.anchor=[N,y0];
      for(let i=0;i<Math.round(dens*2);i++) limb(-1,0,N+40,rr(0,.6)*N,rr(2.6,3.3),N*rr(.7,1),rr(16,24)*s,3,o);
      limb(-1,0,-40,rr(.65,.9)*N,rr(-.5,-.2),N*rr(.45,.6),14*s,2,o);
    } else if(kind==="blossom"){
      const o={minW:2,taper:.7,wiggle:.32,gravity:.002,kids:3,spread:[.4,1],leafDepth:2,leafStart:.15,leafGap:36*G,la:[.3,1.2],flex:1.2,leafFlex:.6,
        leaf:()=>{ if(R()<.72){ const r=rr(13,22)*s; return {v:vA(), L:r*2.5, W:r*2.8}; } return lance(rr(35,55)*s,rr(8,12)*s,3,true); }};
      const y0=rr(.05,.3)*N; limb(-1,0,-40,y0,rr(.2,.5),N*rr(.9,1.1),18*s,3,o); if(!layer) out.anchor=[0,y0];
      for(let i=0;i<Math.round(dens*2);i++) limb(-1,0,rr(.3,1)*N,-40,rr(1.7,2.6),N*rr(.6,.9),rr(10,16)*s,3,o);
    } else if(kind==="willow"){
      const o={minW:1.2,taper:.6,wiggle:.05,gravity:.045,kids:1,spread:[.1,.3],leafDepth:1,leafStart:.1,leafGap:15*G,la:[.25,.5],flex:3,leafFlex:1.3,
        leaf:()=>lance(rr(70,115)*s,rr(7,11)*s,2)};
      const n=Math.round(6+dens*14);
      for(let i=0;i<n;i++) limb(-1,0,rr(-.05,1.05)*N,-30,Math.PI/2+rr(-.9,.9),N*rr(.55,1),rr(5,9)*s,1,o);
      if(!layer) out.anchor=[N*.5,0];
    } else if(kind==="grass"){
      const n=Math.round(12+dens*30);
      for(let i=0;i<n;i++){ const len=N*rr(.35,.9);
        limb(-1,0,rr(-.1,1.1)*N,N+20,-Math.PI/2+rr(-.45,.45),len,rr(10,19)*s,0,{segLen:len/30,minW:.4,taper:1,wiggle:.02,gravity:0,curve:rr(-.0007,.0007),kids:0,spread:[0,0],flex:3.2}); }
      const m=Math.round(3+dens*9);
      const o={minW:1.6,taper:.4,wiggle:.03,gravity:-.002,kids:0,spread:[0,0],leafDepth:0,leafStart:.45,leafGap:30,la:[.35,.6],flex:3,leafFlex:.7,
        leaf:()=>lance(rr(30,46)*s,rr(7,10)*s,7)};
      for(let i=0;i<m;i++) limb(-1,0,rr(0,1)*N,N+20,-Math.PI/2+rr(-.35,.35),N*rr(.6,.95),3*s,0,o);
      if(!layer) out.anchor=[N*.5,N];
    } else if(kind==="fern"){
      const n=Math.round(2+dens*4);
      for(let f=0;f<n;f++){ const len=N*rr(.65,1);
        const id=limb(-1,0,rr(-.05,1.05)*N,N+30,-Math.PI/2+rr(-.7,.7),len,7*s,0,{segLen:len/60,minW:1.5,taper:.8,wiggle:.015,gravity:0,curve:rr(-.0004,.0004),kids:0,spread:[0,0],flex:2.2});
        const st=L.limbs[id].steps;
        for(let k=6;k<st;k+=2){ const t=k/st, pl=(1-t)*rr(85,110)*s+12; for(const sd of [-1,1]) addLeaf(id,k,sd*rr(1.05,1.3),lance(pl,pl*.17,0),.5); }
      }
      if(!layer) out.anchor=[N*.5,N];
    }
    let nv=0; for(const lb of L.limbs) nv+=lb.steps*12;
    L.vbuf=new Float32Array(nv); L.ibuf=new Float32Array(L.leaves.length*8);
  }
  return out;
}

function poseLayer(L,t,W){
  for(const lb of L.limbs){
    let x,y,a;
    if(lb.parent<0){ x=lb.x0; y=lb.y0; a=lb.a0; }
    else { const p=L.limbs[lb.parent]; x=p.X[lb.ppt]; y=p.Y[lb.ppt]; a=p.A[lb.ppt]+lb.relA; }
    const g=gust(x,y,t);
    const b=W*lb.flex*(.22*g+.07*Math.sin(t*lb.f1+lb.ph)+.035*Math.sin(t*lb.f2+lb.ph*1.7));
    const st=lb.steps, k2=2*b/(st*st);
    for(let i=0;i<=st;i++){ lb.X[i]=x; lb.Y[i]=y; lb.A[i]=a; if(i<st){ a+=lb.rel[i]+k2*i; x+=Math.cos(a)*lb.seg; y+=Math.sin(a)*lb.seg; } }
  }
}

const FL_VS_LIMB=`#version 300 es
layout(location=0) in vec2 aP; uniform float uK,uO,uTex;
void main(){ vec2 q=(aP*uK+uO)/uTex; gl_Position=vec4(q.x*2.-1.,1.-q.y*2.,0.,1.); }`;
const FL_FS_LIMB=`#version 300 es
precision mediump float; uniform vec3 uCol; out vec4 o; void main(){ o=vec4(uCol,1.); }`;
const FL_VS_LEAF=`#version 300 es
layout(location=0) in vec2 aQ; layout(location=1) in vec4 aA; layout(location=2) in vec4 aB;
uniform float uK,uO,uTex; out vec2 vUv;
void main(){ vec2 l=vec2(aQ.x*aB.x, aQ.y*aB.y*aA.w); float c=cos(aA.z), s=sin(aA.z);
  vec2 p=aA.xy+vec2(c*l.x-s*l.y, s*l.x+c*l.y); vec2 q=(p*uK+uO)/uTex;
  gl_Position=vec4(q.x*2.-1.,1.-q.y*2.,0.,1.);
  vec2 cell=vec2(mod(aB.z,8.), floor(aB.z/8.)); vUv=(cell+vec2(aQ.x*.97+.015, (aQ.y+.5)*.94+.03))/8.; }`;
const FL_FS_LEAF=`#version 300 es
precision mediump float; uniform sampler2D tAtlas; uniform vec3 uCol; in vec2 vUv; out vec4 o;
void main(){ o=vec4(uCol*texture(tAtlas,vUv).a,1.); }`;
function prog(vs,fs){
  const p=gl.createProgram();
  for(const [t,src] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); gl.attachShader(p,s); }
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc={}; return {p, u:n=> n in loc ? loc[n] : (loc[n]=gl.getUniformLocation(p,n))};
}
const FLP={limb:prog(FL_VS_LIMB,FL_FS_LIMB), leaf:prog(FL_VS_LEAF,FL_FS_LEAF)};
const limbVAO=gl.createVertexArray(), limbBuf=gl.createBuffer();
gl.bindVertexArray(limbVAO); gl.bindBuffer(gl.ARRAY_BUFFER,limbBuf); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const leafVAO=gl.createVertexArray(), quadBuf=gl.createBuffer(), instBuf=gl.createBuffer();
gl.bindVertexArray(leafVAO);
gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,-.5,1,-.5,0,.5,1,.5]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ARRAY_BUFFER,instBuf);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,4,gl.FLOAT,false,32,0); gl.vertexAttribDivisor(1,1);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,4,gl.FLOAT,false,32,16); gl.vertexAttribDivisor(2,1);
gl.bindVertexArray(null);
const floraFB=gl.createFramebuffer();
gl.bindTexture(gl.TEXTURE_2D,T.flora); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,FTEX,FTEX,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
gl.bindFramebuffer(gl.FRAMEBUFFER,floraFB); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,T.flora,0);
gl.bindFramebuffer(gl.FRAMEBUFFER,null);

function paintFlora(t){
  if(!flora) return;
  const W=P.wind, Fl=P.flutter, k=FTEX/FN;
  gl.bindFramebuffer(gl.FRAMEBUFFER,floraFB); gl.viewport(0,0,FTEX,FTEX);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  flora.layers.forEach((L,li)=>{
    const tt=t+li*1.7; poseLayer(L,tt,W);
    const K=k*(li?1.08:1), O=k*(li?-FN*.04:0), col=li?[0,1,0]:[1,0,0];
    const vb=L.vbuf; let n=0;
    for(const lb of L.limbs){
      for(let i=0;i<lb.steps;i++){
        const h0=lb.wd[i]*.5, h1=lb.wd[i+1]*.5;
        const s0=Math.sin(lb.A[i]), c0=Math.cos(lb.A[i]), s1=Math.sin(lb.A[i+1]), c1=Math.cos(lb.A[i+1]);
        const ax=lb.X[i]-s0*h0, ay=lb.Y[i]+c0*h0, bx=lb.X[i]+s0*h0, by=lb.Y[i]-c0*h0;
        const cx=lb.X[i+1]-s1*h1, cy=lb.Y[i+1]+c1*h1, dx=lb.X[i+1]+s1*h1, dy=lb.Y[i+1]-c1*h1;
        vb[n++]=ax;vb[n++]=ay; vb[n++]=bx;vb[n++]=by; vb[n++]=cx;vb[n++]=cy;
        vb[n++]=bx;vb[n++]=by; vb[n++]=dx;vb[n++]=dy; vb[n++]=cx;vb[n++]=cy;
      }
    }
    gl.useProgram(FLP.limb.p);
    gl.uniform1f(FLP.limb.u("uK"),K); gl.uniform1f(FLP.limb.u("uO"),O); gl.uniform1f(FLP.limb.u("uTex"),FTEX); gl.uniform3fv(FLP.limb.u("uCol"),col);
    gl.bindVertexArray(limbVAO); gl.bindBuffer(gl.ARRAY_BUFFER,limbBuf); gl.bufferData(gl.ARRAY_BUFFER,vb,gl.DYNAMIC_DRAW);
    gl.drawArrays(gl.TRIANGLES,0,n/2);
    const ib=L.ibuf; let m=0;
    for(const lf of L.leaves){
      const lb=L.limbs[lf.limb], px=lb.X[lf.pt], py=lb.Y[lf.pt];
      const g=gust(px,py,tt), amp=W*Fl*lf.flex;
      ib[m++]=px; ib[m++]=py;
      ib[m++]=lb.A[lf.pt]+lf.rel+amp*(.9*g*Math.sin(tt*lf.f+lf.ph)+.25*Math.sin(tt*lf.f*2.3+lf.ph*1.7));
      ib[m++]=Math.max(.15,1-amp*1.1*g*(.5+.5*Math.sin(tt*lf.f*.8+lf.ph*2.1)));
      ib[m++]=lf.L; ib[m++]=lf.W; ib[m++]=lf.v; ib[m++]=0;
    }
    gl.useProgram(FLP.leaf.p);
    gl.uniform1f(FLP.leaf.u("uK"),K); gl.uniform1f(FLP.leaf.u("uO"),O); gl.uniform1f(FLP.leaf.u("uTex"),FTEX); gl.uniform3fv(FLP.leaf.u("uCol"),col);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,T.atlas); gl.uniform1i(FLP.leaf.u("tAtlas"),0);
    gl.bindVertexArray(leafVAO); gl.bindBuffer(gl.ARRAY_BUFFER,instBuf); gl.bufferData(gl.ARRAY_BUFFER,ib,gl.DYNAMIC_DRAW);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,L.leaves.length);
  });
  gl.disable(gl.BLEND); gl.bindVertexArray(null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.bindTexture(gl.TEXTURE_2D,T.flora); gl.generateMipmap(gl.TEXTURE_2D);
}
function buildFloraTex(){
  flora=makeFlora(P.floraKind||"olive", P.seed, P.gDens);
  floraAnchor=[flora.anchor[0]/FN, 1-flora.anchor[1]/FN];
  paintFlora(time);
  dirty=true;
}

function oklab2lin(L,a,b){
  const l_=L+.3963377774*a+.2158037573*b, m_=L-.1055613458*a-.0638541728*b, s_=L-.0894841775*a-1.291485548*b;
  const l=l_**3,m=m_**3,s=s_**3;
  return [4.0767416621*l-3.3077115913*m+.2309699292*s, -1.2684380046*l+2.6097574011*m-.3413193965*s, -.0041960863*l-.7034186147*m+1.707614701*s];
}
function oklch(L,C,h){
  h=((h%360)+360)%360; let lin;
  for(let i=0;i<24;i++){ const a=C*Math.cos(h*Math.PI/180), b=C*Math.sin(h*Math.PI/180); lin=oklab2lin(L,a,b); if(lin.every(v=>v>=-1e-4&&v<=1.0001)) break; C*=.85; }
  return "#"+lin.map(v=>{ v=Math.min(1,Math.max(0,v)); v=v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055; return Math.round(v*255).toString(16).padStart(2,"0"); }).join("");
}

function localPalette(text, salt){

  if(!text){ note.textContent="Describe a mood first, like “late summer grief” or “cold neon chapel”."; return; }
  if(sampleFn){

    const prompt=`You are a colorist for analog double-exposure portrait photography: a crisp human silhouette filled with a blurred, gradient-mapped subject, with light projected through leaves or flowers, film grain and halation. Design one palette for the mood: "${text}".
Reply with only JSON: {"name": "2-3 word evocative name", "bg": "#hex backdrop/paper", "bg2": "#hex second backdrop tone for a soft gradient", "shadow": "#hex darkest tone inside the silhouette", "mid": "#hex midtone inside the silhouette", "high": "#hex highlight inside the silhouette", "light": "#hex core color of the projected light", "ember": "#hex saturated color at the edges of light patches", "halo": "#hex glow around the silhouette edge"}.

    try{

    }catch(e){

}

  if(update){ if(!cur) return; name=name||cur.name; }
  else if(!name){ name=(activeCustom&&cur? cur.name : LOOKS[lookIdx]?.name||"Look")+" variant"; }
  const data=snapshotLook(name);
  if(update) data.created=cur.created||Date.now();
  try{
    if(lookStore){
      if(update){ await lookStore.doc(cur.id).set(data); }
      else { const ref=await lookStore.add(data); activeCustom=ref.id; }
    } else {
      if(update){ Object.assign(cur,data); }
      else { const id="l"+Date.now().toString(36); customLooks.push({id,...data}); activeCustom=id; }
      lsLooks(true); renderCustom();
    }
    inp.value=""; note.textContent=update?`Updated “${name}”.`:`Saved “${name}”.`; markLooks();
  }catch(e){ note.textContent="The look could not be saved. Try again in a moment."; }
}
async function deleteLook(id){
  const L=customLooks.find(l=>l.id===id); if(!L) return;
  const note=$("#lookNote");
  if(note.dataset.confirm!==id){ note.dataset.confirm=id; note.textContent=`Press × again to delete “${L.name}”.`; setTimeout(()=>{ if(note.dataset.confirm===id){ note.dataset.confirm=""; note.textContent=""; } },4000); return; }
  note.dataset.confirm="";
  try{
    if(lookStore) await lookStore.doc(id).delete();
    else { customLooks=customLooks.filter(l=>l.id!==id); lsLooks(true); renderCustom(); }
    if(activeCustom===id) activeCustom=null;
    note.textContent=`Deleted “${L.name}”.`; markLooks();
  }catch(e){ note.textContent="The look could not be deleted. Try again in a moment."; }
}
function applyCustom(id){
  const L=customLooks.find(l=>l.id===id); if(!L) return;
  let p={}; try{ p=JSON.parse(L.p||"{}"); }catch(e){}
  const keep={}; for(const k of LOOK_SKIP) keep[k]=P[k];
  P={...DEF,...p,...keep};
  if(P.gobo==="image" && !S.goboAspect){ P.gobo="dapple"; P.flora="dapple"; }
  if(Array.isArray(L.pal)&&L.pal.length===8){ PAL=L.pal.slice(); palName=L.palName||L.name; }
  if(P.gobo==="branch") buildFloraTex();
  activeCustom=id; dirty=true; syncControls(); markLooks();
  $("#lookName").value=""; $("#lookNote").textContent=`“${L.name}” loaded. Adjust anything, then Update or Save as new.`;
}
function applyLook(i){
  const L=LOOKS[i]; lookIdx=i; activeCustom=null;
  const keep={dust:P.dust,dustOp:P.dustOp,sharpen:P.sharpen,clarity:P.clarity,maskMode:P.maskMode,personTh:P.personTh,personSoft:P.personSoft,keyTol:P.keyTol,keySoft:P.keySoft,lumaDarker:P.lumaDarker,invertMask:P.invertMask,imgFormat:P.imgFormat,imgSize:P.imgSize,imgLong:P.imgLong,imgQuality:P.imgQuality,vFormat:P.vFormat,vSize:P.vSize,vLong:P.vLong,vQuality:P.vQuality,vFps:P.vFps,vDurMode:P.vDurMode,vSecs:P.vSecs,seed:P.seed,smoothing:P.smoothing};
  P={...DEF,...keep};
  const fl=FLORA.find(x=>x.id===L.p.flora); if(fl) Object.assign(P,fl.p);
  Object.assign(P,L.p);
  if(fl && fl.kind){ P.floraKind=fl.kind; buildFloraTex(); }
  PAL=PALETTES[L.pal].c.slice(); palName=PALETTES[L.pal].name;
  dirty=true; syncControls();
}
function buildPalette(host){
  const sw=document.createElement("div"); sw.className="swatches";
  PAL_KEYS.forEach((k,i)=>{
    const w=document.createElement("label"); w.className="swatch";
    const inp=document.createElement("input"); inp.type="color"; inp.id="sw_"+k; inp.setAttribute("aria-label",PAL_LABELS[i]);
    inp.oninput=()=>{ PAL[i]=inp.value; palName="Custom"; dirty=true; markPal(); };
    const s=document.createElement("span"); s.textContent=PAL_LABELS[i];
    w.append(inp,s); sw.appendChild(w);
  });
  host.appendChild(sw);
  const h=document.createElement("div"); h.className="sub-h"; h.textContent="Generate from a mood"; host.appendChild(h);
  const mood=document.createElement("div"); mood.className="mood";
  mood.innerHTML=`<input id="moodIn" type="text" placeholder="e.g. late summer grief" aria-label="Mood"><button class="btn" id="moodGo" type="button">Generate</button><button class="btn" id="moodShuffle" type="button" title="Random harmonious palette">Shuffle</button>`;
  host.appendChild(mood);
  const note=document.createElement("div"); note.className="note"; note.id="moodNote"; host.appendChild(note);
  const h2=document.createElement("div"); h2.className="sub-h"; h2.textContent="Palettes"; host.appendChild(h2);
  const grid=document.createElement("div"); grid.className="palettes"; grid.id="palGrid"; host.appendChild(grid);
  setTimeout(()=>{
    renderPalGrid();
    $("#moodGo").onclick=generateMood;
    $("#moodIn").addEventListener("keydown",e=>{ if(e.key==="Enter") generateMood(); });
    $("#moodShuffle").onclick=()=>{ const t=$("#moodIn").value.trim(); applyPalette(localPalette(t||String(Date.now()), shuffleN++)); $("#moodNote").textContent = t ? "Variation from the built-in generator." : "Random palette from the built-in generator."; };
  });
}
const userPals=[];
function renderPalGrid(){
  const grid=$("#palGrid"); if(!grid) return; grid.innerHTML="";
  [...userPals, ...PALETTES].forEach(p=>{
    const b=document.createElement("button"); b.type="button"; b.className="pal"; b.dataset.pal=p.name;
    b.innerHTML=`<span class="strip">${p.c.map(c=>`<i style="background:${c}"></i>`).join("")}</span><span>${esc(p.name)}</span>`;
    b.onclick=()=>applyPalette(p,true);
    grid.appendChild(b);
  });
  markPal();
}
function applyPalette(p, fromGrid){
  PAL=p.c.slice(); palName=p.name;
  if(!fromGrid && !PALETTES.includes(p) && !userPals.includes(p)){ userPals.unshift(p); if(userPals.length>6) userPals.pop(); renderPalGrid(); }
  dirty=true; syncPalette();
}
function syncPalette(){ PAL_KEYS.forEach((k,i)=>{ const el=$("#sw_"+k); if(el) el.value=PAL[i]; }); markPal(); }
function markPal(){ document.querySelectorAll(".pal").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.pal===palName))); }
function buildFlora(host){
  const chips=document.createElement("div"); chips.className="chips";
  for(const f of FLORA){ const b=document.createElement("button"); b.type="button"; b.className="chip"; b.dataset.flora=f.id; b.textContent=f.name; b.onclick=()=>applyFlora(f.id); chips.appendChild(b); }
  const up=document.createElement("button"); up.type="button"; up.className="chip"; up.dataset.flora="image"; up.textContent="Your overlay…"; up.onclick=()=>$("#goboFile").click(); chips.appendChild(up);
  host.appendChild(chips);
  buildRows(host,FLORA_ROWS);
}
function buildPanel(){
  const panel=$("#panel");
  for(const s of SECTIONS){
    const d=document.createElement("details"); if(s.open) d.open=true;
    const sm=document.createElement("summary"); sm.textContent=s.title; d.appendChild(sm);
    const body=document.createElement("div"); body.className="sec"; d.appendChild(body);
    if(s.build) s.build(body); else buildRows(body,s.rows);
    panel.appendChild(d);
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function setStatus(html){ $("#status").innerHTML=html; }

/* ---------------- Overlay upload ---------------- */
$("#goboFile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return; e.target.value="";
  const url=URL.createObjectURL(f);
  if(S.goboVideo){ S.goboVideo.pause(); S.goboVideo=null; }
  if(f.type.startsWith("video")){
    const v=document.createElement("video"); v.muted=true; v.loop=true; v.playsInline=true; v.src=url;
    await new Promise(r=>v.onloadeddata=r); try{ await v.play(); }catch(_){}
    S.goboVideo=v; S.goboAspect=v.videoWidth/v.videoHeight; upload(T.img,v,false);
  } else {
    const im=new Image(); im.src=url; try{ await im.decode(); }catch(_){ setStatus("That overlay could not be opened."); return; }
    S.goboAspect=im.naturalWidth/im.naturalHeight; upload(T.img,im,false);
  }
  P.gobo="image"; P.flora="image"; P.gScale=4; P.panX=0; P.panY=0; P.gRot=0; dirty=true; syncControls();
  setStatus(`Overlay <b>${esc(f.name)}</b> loaded. Bright areas become light; use Invert overlay for shadows.`);
};

/* ---------------- Files, views, export ---------------- */
$("#btnOpen").onclick=()=>$("#file").click();
$("#file").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; loadSource(f).catch(err=>{ console.warn(err); setStatus("That file could not be opened. Try a JPG, PNG, WebP, MP4 or WebM."); }); };
const stage=$("#stage"), drop=$("#drop");
stage.addEventListener("dragover",e=>{ e.preventDefault(); drop.hidden=false; });
stage.addEventListener("dragleave",e=>{ if(!stage.contains(e.relatedTarget)) drop.hidden=true; });
stage.addEventListener("drop",e=>{ e.preventDefault(); drop.hidden=true; const f=e.dataTransfer.files[0]; if(f) loadSource(f).catch(()=>setStatus("That file could not be opened.")); });
function setView(v){ view=v; $("#vRes").setAttribute("aria-pressed",String(v===0)); $("#vMask").setAttribute("aria-pressed",String(v===1)); dirty=true; }
$("#vRes").onclick=()=>setView(0);
$("#vMask").onclick=()=>setView(1);
let prevView=0;
const holdOn=()=>{ prevView=view; view=2; $("#vOrig").setAttribute("aria-pressed","true"); dirty=true; };
const holdOff=()=>{ if(view!==2) return; view=prevView; $("#vOrig").setAttribute("aria-pressed","false"); dirty=true; };
$("#vOrig").addEventListener("pointerdown",holdOn);
["pointerup","pointerleave","pointercancel"].forEach(ev=>$("#vOrig").addEventListener(ev,holdOff));
$("#vOrig").addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); holdOn(); } });
$("#vOrig").addEventListener("keyup",holdOff);
$("#btnSeed").onclick=()=>{ P.seed=Math.floor(Math.random()*997)+1; if(P.gobo==="branch") buildFloraTex(); dirty=true; };
const seekEl=$("#seek"), seekT=$("#seekT"); let scrubbing=false;
const fmtT=t=>{ t=Math.max(0,t||0); const m=Math.floor(t/60), s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0"); };
function syncScrub(){
  if(S.kind!=="video"||!S.el) return;
  const d=S.el.duration||0;
  if(!scrubbing && d) seekEl.value=S.el.currentTime/d;
  seekT.textContent=fmtT(S.el.currentTime)+" / "+fmtT(d);
}
seekEl.addEventListener("pointerdown",()=>{ scrubbing=true; });
["pointerup","pointercancel","change"].forEach(ev=>seekEl.addEventListener(ev,()=>{ scrubbing=false; }));
seekEl.addEventListener("input",()=>{
  if(S.kind!=="video"||analyzing) return;
  const d=S.el.duration||0; if(!d) return;
  S.el.currentTime=Math.min(d-.001,+seekEl.value*d);
  seekT.textContent=fmtT(S.el.currentTime)+" / "+fmtT(d);
});
function onVideoSeeked(){
  if(analyzing || S.kind!=="video") return;
  const v=S.el;
  if(P.maskMode==="auto" && mpState==="ready"){ if(segBusy) S.segAgain=true; else runSeg(); }
  else { upload(T.src,v,true); S.newMask=true; }
  syncScrub(); dirty=true;
}
function updatePlayBtn(){ $("#scrubWrap").hidden=S.kind!=="video"; syncScrub(); const b=$("#btnPlay"); b.hidden=S.kind!=="video"; if(S.kind==="video") b.textContent=S.el.paused?"Play":"Pause"; syncControls(); }
$("#btnPlay").onclick=()=>{ if(S.kind!=="video") return; if(S.el.paused) S.el.play(); else S.el.pause(); updatePlayBtn(); };

async function offerFile(blob, name, kind){
  if(dlFn){
    try{ await dlFn.save({filename:name, data:blob}); setStatus(`Saved <b>${esc(name)}</b>.`); return; }
    catch(e){ if(e && e.code==="declined"){ setStatus("Save cancelled."); return; } }
  }
  const url=URL.createObjectURL(blob);
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><b>${esc(name)}</b><button class="btn" type="button">Close</button></div>${kind==="video"?`<video src="${url}" controls loop autoplay muted playsinline></video>`:`<img src="${url}" alt="Exported image">`}<div class="note">Saving is not available in this view. Right-click the ${kind} and choose Save ${kind==="video"?"video":"image"} as.</div></div>`;
  m.querySelector("button").onclick=()=>{ m.remove(); URL.revokeObjectURL(url); };
  document.body.appendChild(m);
}
/* ---------------- Export: images and videos ---------------- */
function exportDims(sizeKey, customLong, even){
  let W=cv.width, H=cv.height;
  const fit=L=>{ const k=L/Math.max(S.w,S.h); W=Math.round(S.w*k); H=Math.round(S.h*k); };
  if(sizeKey==="source"){ W=S.w; H=S.h; }
  else if(sizeKey==="custom") fit(customLong);
  else if(sizeKey==="720"||sizeKey==="1080"){ const sh=+sizeKey, k=sh/Math.min(S.w,S.h); W=Math.round(S.w*k); H=Math.round(S.h*k); }
  else if(sizeKey!=="preview") fit(+sizeKey);
  const cap=Math.min(MAXTEX,8192), k=Math.min(1,cap/Math.max(W,H)); W=Math.round(W*k); H=Math.round(H*k);
  if(even){ W-=W%2; H-=H%2; }
  return [Math.max(2,W),Math.max(2,H)];
}
const stamp=()=>new Date().toISOString().slice(0,19).replace(/[-:T]/g,"");
$("#btnPng").onclick=async()=>{
  if(exporting) return;
  const btn=$("#btnPng"); btn.disabled=true;
  const pw=cv.width, ph=cv.height;
  const [W,H]=exportDims(P.imgSize,P.imgLong,false);
  const mime={png:"image/png",jpg:"image/jpeg",webp:"image/webp"}[P.imgFormat]||"image/png";
  const pv=view; view=0;
  cv.width=W; cv.height=H; render(W,H);
  const blob=await new Promise(r=>cv.toBlob(r,mime,P.imgQuality));
  cv.width=pw; cv.height=ph; view=pv; dirty=true;
  btn.disabled=false;
  if(!blob){ setStatus("Export failed. Try a smaller image size."); return; }
  const ext=blob.type==="image/jpeg"?"jpg":blob.type==="image/webp"?"webp":"png";
  if(ext!==P.imgFormat && !(ext==="jpg"&&P.imgFormat==="jpg")) setStatus(`This browser cannot write ${P.imgFormat.toUpperCase()}, so the image was saved as ${ext.toUpperCase()}.`);
  offerFile(blob,`ghostlight-${stamp()}-${W}x${H}.${ext}`,"image");
};

function seekTo(v,t){ return new Promise(res=>{ let done=false; const fin=()=>{ if(done) return; done=true; v.removeEventListener("seeked",fin); res(); }; v.addEventListener("seeked",fin); setTimeout(fin,1500); v.currentTime=Math.min(Math.max(0,t),Math.max(0,(v.duration||0)-.001)); }); }
const waitFor=(fn,ms)=>new Promise(res=>{ const t0=performance.now(); const tick=()=>{ if(fn()||performance.now()-t0>ms) res(); else setTimeout(tick,4); }; tick(); });
let exporting=false, cancelExport=false;
const VQ={low:4,medium:10,high:20,max:40};
async function pickCodec(fmt,W,H,fps,bitrate){
  const list = fmt==="mp4" ? ["avc1.640034","avc1.640033","avc1.4d0034","avc1.42003e","avc1.42001f"] : ["vp09.00.40.08","vp09.00.10.08","vp8"];
  for(const codec of list){
    const cfg={codec,width:W,height:H,bitrate,framerate:fps,bitrateMode:"variable"};
    if(fmt==="mp4") cfg.avc={format:"avc"};
    try{ const s=await VideoEncoder.isConfigSupported(cfg); if(s.supported) return cfg; }catch(e){}
  }
  return null;
}
function setExportUi(on,text){
  const b=$("#btnRec"); b.dataset.on=on?"1":"0"; b.textContent=on?(text||"Cancel export"):"Export video";
  $("#btnPng").disabled=on;
}
async function exportVideo(){
  if(exporting){ cancelExport=true; return; }
  if(!("VideoEncoder" in window) || !("VideoFrame" in window)) return legacyRecord();
  const fmt=P.vFormat, fps=+P.vFps;
  const [W,H]=exportDims(P.vSize,P.vLong,true);
  const bitrate=Math.round((VQ[P.vQuality]||10)*1e6*Math.max(.35,(W*H)/(1920*1080)));
  const cfg=await pickCodec(fmt,W,H,fps,bitrate);
  if(!cfg){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(fmt==="mp4"?"video/mp4":"video/webm")){ setStatus(`Offline ${fmt.toUpperCase()} encoding is not available in this browser, so it records in real time instead.`); return legacyRecord(); }
    setStatus(`This browser cannot encode ${fmt.toUpperCase()} at ${W}×${H}. Try ${fmt==="mp4"?"WebM":"MP4"} or a smaller size.`); return;
  }
  if(fmt==="mp4" && !window.Mp4Muxer) await loadScript("lib/mp4-muxer.js");
  if(fmt==="webm" && !window.WebMMuxer) await loadScript("lib/webm-muxer.js");
  let dur, t0=0; const isVid=S.kind==="video", v=S.el;
  if(isVid){ const d=v.duration||0; if(P.vDurMode==="clip"){ dur=d; t0=0; } else { dur=P.vSecs; t0=v.currentTime||0; } }
  else dur=P.vSecs;
  const N=Math.max(1,Math.round(dur*fps));
  const muxer = fmt==="mp4"
    ? new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(), video:{codec:"avc",width:W,height:H,frameRate:fps}, fastStart:"in-memory"})
    : new WebMMuxer.Muxer({target:new WebMMuxer.ArrayBufferTarget(), video:{codec:cfg.codec.startsWith("vp8")?"V_VP8":"V_VP9",width:W,height:H,frameRate:fps}});
  let encErr=null;
  const enc=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta), error:e=>{ encErr=e; }});
  enc.configure(cfg);
  exporting=true; cancelExport=false; setExportUi(true);
  const wasPaused=isVid?v.paused:true; if(isVid) v.pause();
  const pw=cv.width, ph=cv.height, pv=view, baseTime=time, baseFrame=frameNo;
  view=0; cv.width=W; cv.height=H;
  try{
    for(let i=0;i<N;i++){
      if(cancelExport||encErr) break;
      const t=i/fps;
      if(isVid){
        const d=v.duration||1; await seekTo(v,(t0+t)%d);
        if(P.maskMode==="auto" && mpState==="ready"){ S.segDone=false; await runSeg(); await waitFor(()=>S.segDone,2000); }
        else upload(T.src,v,true);
        S.newMask=true;
      }
      time=baseTime+t; frameNo=baseFrame+i;
      if(P.gobo==="branch" && flora) paintFlora(time);
      S.offline=true; render(W,H);
      const frame=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
      enc.encode(frame,{keyFrame:i%(fps*2)===0}); frame.close();
      while(enc.encodeQueueSize>3) await new Promise(r=>setTimeout(r,4));
      if(i%3===0){ const pct=Math.round(i/N*100); setExportUi(true,`Cancel · ${pct}%`); setStatus(`Rendering ${fmt.toUpperCase()} ${W}×${H} · frame ${i+1} of ${N}`); await new Promise(r=>setTimeout(r,0)); }
    }
    await enc.flush();
  }catch(e){ encErr=encErr||e; }
  S.offline=false; try{ enc.close(); }catch(e){}
  cv.width=pw; cv.height=ph; view=pv; time=baseTime; dirty=true; S.newMask=true;
  exporting=false; setExportUi(false);
  if(isVid){ if(P.maskMode==="auto"&&mpState==="ready") runSeg(); if(!wasPaused) v.play(); updatePlayBtn(); }
  if(encErr){ console.warn(encErr); setStatus("Video export failed. Try a smaller size or the other format."); return; }
  if(cancelExport){ setStatus("Export cancelled."); return; }
  muxer.finalize();
  const blob=new Blob([muxer.target.buffer],{type:fmt==="mp4"?"video/mp4":"video/webm"});
  setStatus(`Rendered ${(blob.size/1048576).toFixed(1)} MB ${fmt.toUpperCase()} · ${W}×${H} · ${dur.toFixed(1)} s at ${fps} fps`);
  offerFile(blob,`ghostlight-${stamp()}-${W}x${H}.${fmt}`,"video");
}

// Fallback for browsers without WebCodecs: real-time capture of the canvas
let rec=null;
function legacyRecord(){
  if(recording){ rec && rec.state!=="inactive" && rec.stop(); return; }
  if(!window.MediaRecorder || !cv.captureStream){ setStatus("This browser cannot export video. Try Chrome, Edge or Safari."); return; }
  const want=P.vFormat==="mp4"?["video/mp4;codecs=avc1.640028","video/mp4"]:["video/webm;codecs=vp9","video/webm"];
  const mime=want.find(t=>MediaRecorder.isTypeSupported(t))||["video/webm","video/mp4"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  const stream=cv.captureStream(+P.vFps), chunks=[];
  rec=new MediaRecorder(stream,{mimeType:mime||undefined, videoBitsPerSecond:(VQ[P.vQuality]||10)*1e6});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  let timer=null;
  const finish=()=>{ recording=false; setExportUi(false); clearTimeout(timer); if(S.kind==="video"){ S.el.loop=true; S.el.onended=null; S.el.play(); } };
  rec.onstop=()=>{ finish(); const ext=mime.includes("mp4")?"mp4":"webm"; offerFile(new Blob(chunks,{type:mime||"video/webm"}),`ghostlight-${stamp()}.${ext}`,"video"); };
  recording=true; setView(0); setExportUi(true,"Stop recording"); $("#btnPng").disabled=false;
  rec.start(250);
  if(S.kind==="video" && P.vDurMode==="clip"){ S.el.loop=false; S.el.currentTime=0; S.el.play(); S.el.onended=()=>rec.state!=="inactive"&&rec.stop(); setStatus("Recording one pass of the clip in real time…"); }
  else { if(S.kind==="video") S.el.play(); timer=setTimeout(()=>rec.state!=="inactive"&&rec.stop(), P.vSecs*1000); setStatus(`Recording ${P.vSecs} s in real time…`); }
}
$("#btnRec").onclick=()=>exportVideo();

/* ---------------- Boot ---------------- */
buildPanel();
setSample();
applyLook(0);
syncControls();
requestAnimationFrame(loop);
</script>
